<body>
<main>
<h1>rompecabezas</h1>
<button id="shuffle" type="button">Mezclar</button>
<div id="board" aria-label="Rompecabezas de 36 piezas"></div>
</main>
<script>
(() => {
  const cols=6, rows=6, total=36;
  const board=document.getElementById('board');
  let order=[], selected=null;
  function shuffle(){
    order=Array.from({length:total},(_,i)=>i);
    for(let i=total-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [order[i],order[j]]=[order[j],order[i]];
    }
    if(order.every((v,i)=>v===i))[order[0],order[1]]=[order[1],order[0]];
    selected=null;
    render();
  }
  function render(){
    board.innerHTML='';
    order.forEach((id,slot)=>{
      const piece=document.createElement('button');
      piece.type='button';
      piece.className='piece'+(selected===slot?' selected':'');
      piece.setAttribute('aria-label',`Pieza ${id+1}`);
      const x=id%cols,y=Math.floor(id/cols);
      piece.style.backgroundPosition=`${x*100/(cols-1)}% ${y*100/(rows-1)}%`;
      piece.addEventListener('click',()=>{
        if(selected===null){selected=slot;render();return;}
        if(selected===slot){selected=null;render();return;}
        [order[selected],order[slot]]=[order[slot],order[selected]];
        selected=null;render();
      });
      board.appendChild(piece);
    });
  }
  document.getElementById('shuffle').addEventListener('click',shuffle);
  shuffle();
})();
</script>
</body>
